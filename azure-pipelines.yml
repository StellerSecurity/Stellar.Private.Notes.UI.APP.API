# PHP as Linux Web App on Azure
# Build, package and deploy your PHP project to Azure Linux Web App.
# Add steps that run tests and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/php

trigger:
- main

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: '236719ec-5cab-4421-a60e-19b39c74e814'

  # Web app name
  webAppName: 'StellarPrivateNotesUIAPPAPIProd'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

  # Environment name
  environmentName: 'StellarPrivateNotesUIAPPAPIProd'

  # Root folder under which your composer.json file is available.
  rootFolder: $(System.DefaultWorkingDirectory)

stages:
- stage: Build
  displayName: Build stage
  variables:
    phpVersion: '8.2'
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        sudo update-alternatives --set php /usr/bin/php$(phpVersion)
        sudo update-alternatives --set phar /usr/bin/phar$(phpVersion)
        sudo update-alternatives --set phpdbg /usr/bin/phpdbg$(phpVersion)
        sudo update-alternatives --set php-cgi /usr/bin/php-cgi$(phpVersion)
        sudo update-alternatives --set phar.phar /usr/bin/phar.phar$(phpVersion)
        php -version
      workingDirectory: $(rootFolder)
      displayName: 'Use PHP version $(phpVersion)'

    - script: |
        set -e
        php tests/controller-contract.php
        php tests/realtime-security-contract.php
        php -l app/Services/NotesRealtimeService.php
        php -l app/Http/Controllers/V1/NotesRealtimeController.php
      workingDirectory: $(rootFolder)
      displayName: 'Verify legacy API and realtime isolation contracts'

    - script: composer install --no-dev --no-plugins --no-interaction --prefer-dist --optimize-autoloader
      workingDirectory: $(rootFolder)
      displayName: 'Composer install'

    - script: |
        set -eu
        mkdir -p "$(Build.ArtifactStagingDirectory)/app"
        for path in app artisan bootstrap config database default public resources routes vendor composer.json composer.lock; do
          if [ -e "$path" ]; then
            rsync -a --exclude='.git' --exclude='.env*' --exclude='auth.json' \
              --exclude='*.[mM][dD]' --exclude='OPERATIONS.txt' \
              --exclude='*.key' --exclude='*.pem' --exclude='*.sqlite' \
              --exclude='hot' --exclude='storage' \
              "$path" "$(Build.ArtifactStagingDirectory)/app/"
          fi
        done
        mkdir -p "$(Build.ArtifactStagingDirectory)/app/storage/framework/cache/data" \
          "$(Build.ArtifactStagingDirectory)/app/storage/framework/sessions" \
          "$(Build.ArtifactStagingDirectory)/app/storage/framework/views" \
          "$(Build.ArtifactStagingDirectory)/app/storage/logs"
      workingDirectory: $(rootFolder)
      displayName: 'Stage application files without repository metadata or local secrets'

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: 'Upload package'
      artifact: drop

- stage: Deploy
  displayName: 'Deploy Web App'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App : StellarPrivateNotesUIAPPAPIProd'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              appType: webAppLinux
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip